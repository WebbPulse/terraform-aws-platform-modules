name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.13.1"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -recursive -check
        run: terraform fmt -recursive -check -diff

  discover:
    name: Discover directories
    runs-on: ubuntu-latest
    outputs:
      validate: ${{ steps.find.outputs.validate }}
      test: ${{ steps.find.outputs.test }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - id: find
        name: Build the validate and test matrices
        env:
          VALIDATE_SKIP: "modules/acm-certificate modules/staging-dns"
        run: |
          set -euo pipefail

          validate=()
          for d in modules/*/ examples/*/; do
            d="${d%/}"
            skip=false
            for s in $VALIDATE_SKIP; do
              [ "$d" = "$s" ] && skip=true
            done
            if [ "$skip" = true ]; then
              echo "skip $d (needs a caller supplied provider alias)"
              continue
            fi
            validate+=("$d")
          done

          tests=()
          untested=()
          for d in modules/*/; do
            d="${d%/}"
            if [ -d "$d/tests" ]; then
              tests+=("$d")
            else
              untested+=("$d")
            fi
          done

          if [ ${#untested[@]} -gt 0 ]; then
            for u in "${untested[@]}"; do
              echo "::error::$u has no tests directory; every module must ship a .tftest.hcl suite"
            done
            exit 1
          fi

          {
            printf 'validate=%s\n' "$(printf '%s\n' "${validate[@]}" | jq -R . | jq -sc .)"
            printf 'test=%s\n' "$(printf '%s\n' "${tests[@]}" | jq -R . | jq -sc .)"
          } >> "$GITHUB_OUTPUT"

          echo "validate: ${#validate[@]} directories"
          echo "test: ${#tests[@]} modules"

  validate:
    name: validate ${{ matrix.dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.validate) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Point registry module sources at this checkout
        run: python3 .github/scripts/local_module_override.py "${{ matrix.dir }}" .

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false -no-color

      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  test:
    name: test ${{ matrix.dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.test) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false -no-color

      - name: terraform test
        working-directory: ${{ matrix.dir }}
        run: terraform test -no-color

  node-tests:
    name: node tests staging-access-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the test dependencies
        working-directory: modules/staging-access-gate
        run: npm install --no-save --no-package-lock @aws-sdk/client-ssm

      - name: Render the CloudFront gate function
        working-directory: modules/staging-access-gate
        run: python3 test/render.py

      - name: node test/run.js
        working-directory: modules/staging-access-gate
        run: node test/run.js

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [fmt, discover, validate, test, node-tests]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled|skipped)"'; then
            echo "::error::at least one upstream job did not succeed"
            exit 1
          fi
