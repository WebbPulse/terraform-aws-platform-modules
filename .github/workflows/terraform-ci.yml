name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.13.1"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -recursive -check
        run: terraform fmt -recursive -check -diff

  resolve:
    name: Resolve affected modules
    runs-on: ubuntu-latest
    outputs:
      validate: ${{ steps.affected.outputs.validate }}
      test: ${{ steps.affected.outputs.test }}
      modules: ${{ steps.affected.outputs.modules }}
      all: ${{ steps.affected.outputs.all }}
      any: ${{ steps.affected.outputs.any }}
      node: ${{ steps.affected.outputs.node }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: affected
        name: Work out the affected modules
        env:
          AFFECTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 .github/scripts/affected_modules.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --base "$AFFECTED_BASE" \
            --head "$GITHUB_SHA"

  resolver-tests:
    name: resolver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: pytest .github/scripts
        run: python3 -m pytest .github/scripts/test_affected_modules.py -q

  validate:
    name: validate ${{ matrix.dir }}
    needs: resolve
    if: needs.resolve.outputs.validate != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.resolve.outputs.validate) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Point registry module sources at this checkout
        run: python3 .github/scripts/local_module_override.py "${{ matrix.dir }}" .

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false -no-color

      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  test:
    name: test ${{ matrix.dir }}
    needs: resolve
    if: needs.resolve.outputs.test != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.resolve.outputs.test) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false -no-color

      - name: terraform test
        working-directory: ${{ matrix.dir }}
        run: terraform test -no-color

  node-tests:
    name: node tests staging-access-gate
    needs: resolve
    if: needs.resolve.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the test dependencies
        working-directory: modules/staging-access-gate
        run: npm install --no-save --no-package-lock @aws-sdk/client-ssm

      - name: Render the CloudFront gate function
        working-directory: modules/staging-access-gate
        run: python3 test/render.py

      - name: node test/run.js
        working-directory: modules/staging-access-gate
        run: node test/run.js

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [fmt, resolve, resolver-tests, validate, test, node-tests]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was deliberately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job did not succeed"
            exit 1
          fi
          for required in fmt resolve resolver-tests; do
            result="$(echo "$RESULTS" | jq -r --arg job "$required" '.[$job].result')"
            if [ "$result" != "success" ]; then
              echo "::error::$required did not succeed: $result"
              exit 1
            fi
          done
